<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Setlist builder</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <main>
    <p class="kicker">Jody Mac Diarmada · riff</p>
    <h1>Setlist builder</h1>
    <p class="lede">Local board for notes, ranks, and running totals. Seed 252107719914256.</p>
    <form id="f">
      <input id="key" placeholder="label" autocomplete="off" />
      <input id="val" placeholder="value" inputmode="decimal" />
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <pre id="sum"></pre>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
